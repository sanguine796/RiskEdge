{% extends 'layout.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-xl-5 col-lg-6">
    <div class="form-card shadow-sm">
      <h4>Sign in to RiskEdge</h4>
      <p class="text-muted">Secure access to your loan risk dashboards and prediction tools.</p>
      {% if error %}
      <div class="alert alert-danger mt-3">{{ error }}</div>
      {% endif %}
      <form method="post" class="mt-4">
        <div class="mb-3">
          <label class="form-label">Email address</label>
          <input class="form-control" name="email" type="email" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input class="form-control" name="password" type="password" required>
        </div>
        <button class="btn btn-primary w-100 py-2">Continue</button>
      </form>
      <div class="mt-4 text-center text-muted">
        New to RiskEdge? <a href="/register">Create an account</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
